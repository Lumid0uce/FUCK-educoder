# dsh-educoder-auto 的 bundle 补丁层
#
# 装好之后，在 profile 的 `dsh.profile.bundles` 里列出 `dsh-educoder-auto` 即生效。
#
#   dsh plugin --profile desktop add link:<本仓库绝对路径>
#
# 本插件不用 schemastery 的 Config（宿主拿不到 schemastery 时也能加载），
# 所有可调项走 profile 里这一行的 config（见 README 的「配置」一节）。

- insert:
    - id: educoder-auto
      name: dsh-educoder-auto
      config: {}
